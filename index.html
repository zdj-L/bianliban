<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便利板</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" data-view="board" data-collapsed="false">
      <div id="surface">
        <div id="board-view">
          <header id="titlebar">
            <span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <h1>便利板</h1>
            <div class="header-actions">
              <button id="shot" type="button">截图</button>
              <button id="collapse" type="button">收起</button>
            </div>
          </header>
          <div id="grid"></div>
        </div>
        <div id="editor-view" hidden>
          <header id="editor-bar">
            <button id="back" type="button">返回</button>
            <h1 id="editor-title">新笔记</h1>
            <button id="editor-rename" type="button" hidden>改名</button>
            <button id="save" type="button">保存</button>
          </header>
          <textarea id="editor-body" maxlength="200000" placeholder="写点什么，或粘贴文字、图片" aria-label="正文"></textarea>
          <footer class="page-actions">
            <button id="editor-delete" type="button" hidden>删除</button>
          </footer>
        </div>
        <div id="image-view" hidden>
          <header id="image-bar">
            <button id="image-back" type="button">返回</button>
            <h1 id="image-title"></h1>
            <button id="image-rename" type="button">改名</button>
            <button id="image-collapse" type="button">收起</button>
          </header>
          <div id="image-stage"></div>
          <div id="image-zoom-actions" hidden>
            <button type="button" class="image-pin" id="image-zoom-pin">钉出</button>
          </div>
          <footer class="page-actions">
            <button type="button" class="image-pin" id="image-pin">钉出</button>
            <button id="image-copy" type="button">复制</button>
            <button id="image-delete" type="button">删除</button>
          </footer>
        </div>
        <p id="status" role="status"></p>
      </div>
      <div id="chip-wrap" hidden>
        <button type="button" id="chip" aria-label="展开便利板">
          <span class="chip-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="3" y="2.5" width="12" height="14" rx="2" fill="#3A4740"/>
              <path d="M6 7h6M6 10h4.5" stroke="#F6F0E6" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="chip-label">便利</span>
        </button>
        <div id="chip-menu" hidden>
          <button type="button" id="quit">退出</button>
        </div>
      </div>
      <div id="name-dialog" hidden>
        <form id="name-form">
          <h2 id="name-heading">给这条笔记起个名字</h2>
          <input id="name-input" type="text" maxlength="200" autocomplete="off" aria-label="名称" />
          <p id="name-hint"></p>
          <div class="dialog-actions">
            <button type="button" id="name-cancel">取消</button>
            <button type="submit">保存</button>
          </div>
        </form>
      </div>
      <div id="handles" aria-hidden="true">
        <div data-resize="North" class="n"></div>
        <div data-resize="South" class="s"></div>
        <div data-resize="West" class="w"></div>
        <div data-resize="East" class="e"></div>
        <div data-resize="NorthWest" class="nw"></div>
        <div data-resize="NorthEast" class="ne"></div>
        <div data-resize="SouthWest" class="sw"></div>
        <div data-resize="SouthEast" class="se"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
